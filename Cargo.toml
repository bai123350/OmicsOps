[workspace]
members = [
  "crates/omicsops-bio",
  "crates/omicsops-core",
  "crates/omicsops-agent",
  "crates/omicsops-protocol",
  "crates/omicsops-agent-core",
  "crates/omicsops-tools",
  "crates/omicsops-runtime",
  "crates/omicsops-science",
  "crates/omicsops-dto",
  "crates/omicsops-store",
  "crates/omicsops-knowledge",
  "crates/omicsops-adapters",
  "crates/omicsops-mcp",
  "crates/omicsops-browser",
  "crates/omicsops-process",
  "src-tauri"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
keyring = { version = "3", features = ["windows-native"] }
pdf-extract = "0.10"
quick-xml = "0.38"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.0.1", default-features = false, features = ["client", "server", "macros", "schemars", "transport-child-process", "transport-io"] }
russh = { version = "0.62.4", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.3.0"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
schemars = { version = "1", features = ["chrono04", "uuid1", "url2"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time", "io-util"] }
tokio-tungstenite = "0.28"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = "4"
