[workspace]
members = [
  "crates/omicsops-core",
  "crates/omicsops-adapters",
  "crates/omicsops-runner",
  "src-tauri"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
keyring = { version = "3", features = ["windows-native"] }
pdf-extract = "0.10"
quick-xml = "0.38"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
russh = { version = "0.62.4", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.3.0"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
schemars = { version = "1", features = ["chrono04", "uuid1", "url2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = "4"
