[package]
name = "omicsops-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
omicsops-agent = { path = "../omicsops-agent" }
omicsops-protocol = { path = "../omicsops-protocol" }
omicsops-science = { path = "../omicsops-science" }
omicsops-process = { path = "../omicsops-process" }
tempfile = "3"
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
hex.workspace = true
omicsops-core = { path = "../omicsops-core" }
omicsops-dto = { path = "../omicsops-dto" }
pdf-extract.workspace = true
quick-xml.workspace = true
regex.workspace = true
reqwest.workspace = true
russh.workspace = true
russh-sftp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true
zip.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
