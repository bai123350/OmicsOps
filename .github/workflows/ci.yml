name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s scripts -p "test_*.py"
      - name: V4 scenario evaluation
        run: cargo test -p omicsops-agent-core scenario_evaluation_suite -- --nocapture
        env:
          OMICSOPS_EVAL_REPORT_PATH: target/evaluation/v4-scenarios.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-scenarios
          path: target/evaluation/v4-scenarios.json
      - run: cargo test --workspace
      - run: npm test
      - run: npm run build

