name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s scripts -p "test_*.py"
      - run: python -B scripts/release.py check-version
      - run: python -B scripts/check_release_privacy.py
      - name: V4 scenario evaluation
        run: cargo test --locked -p omicsops-agent-core scenario_evaluation_suite -- --nocapture
        env:
          OMICSOPS_EVAL_REPORT_PATH: target/evaluation/v4-scenarios.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-scenarios-${{ matrix.os }}
          path: target/evaluation/v4-scenarios.json
          overwrite: true
      - run: npm run build
      - run: cargo test --locked --workspace
      - run: npm test

