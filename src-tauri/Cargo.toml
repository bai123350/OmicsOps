[package]
name = "omicsops-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "omicsops_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
omicsops-bio = { path = "../crates/omicsops-bio" }
async-trait.workspace = true
chrono.workspace = true
base64.workspace = true
omicsops-agent = { path = "../crates/omicsops-agent" }
omicsops-agent-core = { path = "../crates/omicsops-agent-core" }
omicsops-adapters = { path = "../crates/omicsops-adapters" }
omicsops-core = { path = "../crates/omicsops-core" }
omicsops-dto = { path = "../crates/omicsops-dto" }
omicsops-protocol = { path = "../crates/omicsops-protocol" }
omicsops-runtime = { path = "../crates/omicsops-runtime" }
omicsops-science = { path = "../crates/omicsops-science" }
omicsops-store = { path = "../crates/omicsops-store" }
omicsops-knowledge = { path = "../crates/omicsops-knowledge" }
omicsops-mcp = { path = "../crates/omicsops-mcp" }
omicsops-browser = { path = "../crates/omicsops-browser" }
omicsops-process = { path = "../crates/omicsops-process" }
omicsops-tools = { path = "../crates/omicsops-tools" }
reqwest.workspace = true
rmcp.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio.workspace = true
url.workspace = true
uuid.workspace = true
zip.workspace = true

tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
