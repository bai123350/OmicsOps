[package]
name = "omicsops-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "omicsops_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
base64.workspace = true
omicsops-agent = { path = "../crates/omicsops-agent" }
omicsops-adapters = { path = "../crates/omicsops-adapters" }
omicsops-core = { path = "../crates/omicsops-core" }
omicsops-runner = { path = "../crates/omicsops-runner" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
hex.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
